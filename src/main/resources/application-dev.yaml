spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    com.java.springvadin: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.deprecation: ERROR
