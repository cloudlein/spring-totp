services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=${DB_NAME}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USERNAME}'
    ports:
      - '${DB_PORT}:${DB_CONTAINER_PORT:-5432}'
  redis:
    image: 'redis:alpine'
    ports:
      - '${REDIS_PORT}:${REDIS_CONTAINER_PORT:-6379}'

